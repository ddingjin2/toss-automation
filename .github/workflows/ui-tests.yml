name: Tossinvest UI Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    name: PR Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          playwright install --with-deps chromium

      - name: Public site health check
        run: python -c "import urllib.request; urllib.request.urlopen('https://www.tossinvest.com', timeout=10).read(1)"

      - name: Run smoke tests
        env:
          BASE_URL: https://www.tossinvest.com
          BROWSER: chromium
          HEADLESS: "true"
          TRACE_ON_FAILURE: "true"
          VIDEO_ON_FAILURE: "true"
        run: pytest -m smoke --reruns 1 --reruns-delay 1 --junitxml=test-results/smoke.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-artifacts
          path: artifacts/
          if-no-files-found: ignore

  regression:
    name: Main Regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser }}-
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          playwright install --with-deps ${{ matrix.browser }}

      - name: Public site health check
        run: python -c "import urllib.request; urllib.request.urlopen('https://www.tossinvest.com', timeout=10).read(1)"

      - name: Run regression tests
        env:
          BASE_URL: https://www.tossinvest.com
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          TRACE_ON_FAILURE: "true"
          VIDEO_ON_FAILURE: "true"
        run: pytest -m regression -n 2 --reruns 1 --reruns-delay 1 --junitxml=test-results/regression-${{ matrix.browser }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-artifacts-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
