  - id: TI-WEB-027
    title: 검색 결과 키보드 선택
    precondition: 검색 결과 목록이 표시되어 있다.
    steps:
      - 삼성전자를 검색한다.
      - 방향키 또는 Tab 키로 첫 번째 결과에 접근한다.
      - Enter 키로 결과를 선택한다.
    expected_result: 선택한 종목 상세 또는 관련 결과 화면으로 이동한다.
    priority: P1
    tags: [search, keyboard, accessibility]
    data: { query: "삼성전자" }
    smoke: false
    regression: true
    automation_status: conditional
