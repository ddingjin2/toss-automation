  - id: TI-WEB-015
    title: 주문/거래 CTA 비로그인 보호
    precondition: 비로그인 사용자가 종목 상세에 진입해 있다.
    steps:
      - 구매/판매/주문 CTA가 있으면 선택한다.
      - 인증 유도 UI를 확인한다.
    expected_result: 거래 기능은 인증 전 실행되지 않는다.
    priority: P0
    tags: [trade, auth, security]
    data: {}
    smoke: false
    regression: true
    automation_status: staging_required
  - id: TI-WEB-016
    title: 모바일 홈 반응형 렌더링
    precondition: 모바일 뷰포트로 접속한다.
    steps:
      - 390x844 뷰포트에서 홈에 접속한다.
      - 검색과 주요 콘텐츠 노출을 확인한다.
      - 앱 오류가 발생하지 않는지 확인한다.
    expected_result: 주요 UI가 보이고 앱 오류가 없다.
    priority: P0
    tags: [responsive, mobile]
    data: { width: 390, height: 844 }
    smoke: true
    regression: true
    automation_status: ready
  - id: TI-WEB-017
    title: 데스크톱 홈 반응형 렌더링
    precondition: 데스크톱 뷰포트로 접속한다.
    steps:
      - 1440x900 뷰포트에서 홈에 접속한다.
      - 실시간 차트와 카테고리 영역을 확인한다.
    expected_result: 데스크톱 레이아웃에서 핵심 시장 영역이 표시된다.
    priority: P1
    tags: [responsive, desktop]
    data: { width: 1440, height: 900 }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-018
    title: 지원하지 않는 브라우저 안내
    precondition: 서비스가 지원하지 않는 user-agent 또는 브라우저 조합을 사용한다.
    steps:
      - 지원 범위 밖 브라우저 조건으로 접속한다.
      - 안내 문구를 확인한다.
    expected_result: 지원 브라우저 안내와 다운로드/업데이트 링크가 표시된다.
    priority: P2
    tags: [compatibility, negative]
    data: { user_agent: "unsupported" }
    smoke: false
    regression: false
    automation_status: manual_or_lab
