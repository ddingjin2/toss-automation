    title: 모든 지수 목록 진입
    precondition: 홈 지수 목록 영역이 표시되어 있다.
    steps:
      - 모든 지수 링크 또는 버튼을 선택한다.
      - 지수 목록 화면 또는 확장 영역을 확인한다.
    expected_result: 국내/해외 주요 지수 목록이 접근 가능하고 오류가 발생하지 않는다.
    priority: P1
    tags: [home, index, navigation]
    data: { entry_text: "모든 지수" }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-029
    title: 시장 상태 배지 노출
    precondition: 사용자는 홈에 접속해 있다.
    steps:
      - 홈 상단 또는 시장 요약 영역을 확인한다.
      - 국내 장 상태와 해외 장 상태 문구를 확인한다.
    expected_result: 국내 장 닫힘/열림, 해외 프리마켓/정규장 등 시장 상태가 표시된다.
