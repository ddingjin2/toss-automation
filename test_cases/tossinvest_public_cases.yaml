suite: tossinvest_public_web
version: 4
format_reason: >
  YAML is readable in review, supports nested steps/data without escaping-heavy syntax,
  and can later feed a pytest parameter generator.
bvt_suite:
  purpose: >
    Build Verification Test set for quickly deciding whether a new build is usable
    for deeper regression testing.
  pass_criteria:
    - All ready BVT cases pass on Chromium.
    - Conditional BVT cases either pass or are explicitly skipped with a known public-DOM limitation.
    - No full-page application error is observed in any BVT case.
    - Failure screenshots, traces, and Allure results are attached.
  recommended_marker: bvt
  candidate_ids:
    - TI-WEB-001
    - TI-WEB-006
    - TI-WEB-007
    - TI-WEB-008
    - TI-WEB-011
    - TI-WEB-012
    - TI-WEB-016
    - TI-WEB-029
    - TI-WEB-036
    - TI-WEB-037
    - TI-WEB-038
    - TI-WEB-039
    - TI-WEB-040
    - TI-WEB-041
    - TI-WEB-042
    - TI-WEB-043
    - TI-WEB-044
    - TI-WEB-045
    - TI-WEB-046
    - TI-WEB-047
    - TI-WEB-048
    - TI-WEB-049
    - TI-WEB-050
    - TI-WEB-051
    - TI-WEB-052
    - TI-WEB-053
    - TI-WEB-054
    - TI-WEB-055
    - TI-WEB-056
    - TI-WEB-057
    - TI-WEB-058
    - TI-WEB-059
    - TI-WEB-060
required_fields:
  - id
  - title
  - precondition
  - steps
  - expected_result
  - priority
  - tags
  - data
  - smoke
  - regression
cases:
  - id: TI-WEB-001
    title: 홈 랜딩 공개 셸 로딩
    precondition: 사용자는 비로그인 상태이며 지원 브라우저를 사용한다.
    steps:
      - 토스증권 WTS 홈에 접속한다.
      - 상단 네비게이션과 검색 진입점을 확인한다.
      - 실시간 차트 영역을 확인한다.
    expected_result: 홈, 피드, 주식 골라보기, 내 계좌, 검색, 실시간 차트가 표시된다.
    priority: P0
    tags: [home, landing, ui]
    data: { path: "/" }
    smoke: true
    regression: true
    automation_status: ready
  - id: TI-WEB-002
    title: 홈 투자 유의 문구 노출
    precondition: 사용자는 비로그인 상태다.
    steps:
      - 홈에 접속한다.
      - 하단 푸터로 이동한다.
    expected_result: 투자 정보가 참고용이라는 유의 문구와 고객센터/정책 링크가 표시된다.
    priority: P1
    tags: [home, compliance, footer]
    data: { expected_keyword: "투자 판단" }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-003
    title: 홈 실시간 차트 필터 전환
    precondition: 홈 실시간 차트가 로딩되어 있다.
    steps:
      - 홈에 접속한다.
      - 국내 필터를 선택한다.
      - 해외 또는 전체 필터를 선택한다.
    expected_result: 필터 전환 후 페이지 오류 없이 차트 목록이 유지된다.
    priority: P1
    tags: [home, chart, quote]
    data: { filters: ["국내", "해외", "전체"] }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-004
    title: 피드 메뉴 이동
    precondition: 사용자는 홈에 접속해 있다.
    steps:
      - 피드 메뉴를 선택한다.
      - 피드 또는 뉴스 콘텐츠 영역을 확인한다.
    expected_result: 피드/뉴스 성격의 공개 콘텐츠가 표시되고 오류 페이지로 이동하지 않는다.
    priority: P1
    tags: [navigation, feed]
    data: {}
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-005
    title: 주식 골라보기 메뉴 이동
    precondition: 사용자는 홈에 접속해 있다.
    steps:
      - 주식 골라보기 메뉴를 선택한다.
      - 종목 탐색 콘텐츠를 확인한다.
    expected_result: 주식 골라보기 공개 영역이 표시된다.
    priority: P1
    tags: [navigation, discovery]
    data: {}
    smoke: true
    regression: true
    automation_status: ready
  - id: TI-WEB-006
    title: 내 계좌 진입 시 인증 유도
    precondition: 사용자는 비로그인 상태다.
    steps:
      - 홈에서 내 계좌 메뉴를 선택한다.
      - 인증/로그인/앱 안내 UI를 확인한다.
    expected_result: 계좌 정보가 바로 노출되지 않고 인증 또는 로그인 유도 UX가 표시된다.
    priority: P0
    tags: [auth, account, security]
    data: {}
    smoke: true
    regression: true
    automation_status: ready
  - id: TI-WEB-007
    title: 검색 진입점 클릭
    precondition: 홈 검색 진입점이 표시되어 있다.
    steps:
      - 검색 진입점을 클릭하거나 / 키를 입력한다.
      - 검색 입력창 포커스를 확인한다.
    expected_result: 종목 검색 입력창이 표시되고 입력 가능하다.
    priority: P0
    tags: [search, ui]
    data: {}
    smoke: true
    regression: true
    automation_status: ready
  - id: TI-WEB-008
    title: 국내 종목명 검색
    precondition: 검색 입력창이 열려 있다.
    steps:
      - 삼성전자를 입력한다.
      - 검색을 실행한다.
    expected_result: 삼성전자 또는 005930 관련 결과가 표시된다.
    priority: P0
    tags: [search, domestic]
    data: { query: "삼성전자" }
    smoke: true
    regression: true
    automation_status: ready
  - id: TI-WEB-009
    title: 해외 종목명 검색
    precondition: 검색 입력창이 열려 있다.
    steps:
      - Apple 또는 AAPL을 입력한다.
      - 검색 결과를 확인한다.
    expected_result: 애플 또는 AAPL 관련 결과가 표시된다.
    priority: P1
    tags: [search, us-stock]
    data: { query: "AAPL" }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-010
    title: 존재하지 않는 종목 검색
    precondition: 검색 입력창이 열려 있다.
    steps:
      - 존재하지 않는 문자열을 입력한다.
      - 검색을 실행한다.
    expected_result: 빈 결과 안내가 표시되거나 입력값이 유지된다.
    priority: P1
    tags: [search, negative]
    data: { query: "ZZZ_NO_SUCH_STOCK_987654" }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-011
    title: 검색 결과에서 종목 상세 진입
    precondition: 삼성전자 검색 결과가 표시되어 있다.
    steps:
      - 삼성전자 결과를 선택한다.
      - 상세 화면 제목 또는 종목 코드를 확인한다.
    expected_result: 삼성전자 상세 화면으로 이동한다.
    priority: P0
    tags: [search, stock-detail, quote]
    data: { query: "삼성전자" }
    smoke: true
    regression: true
    automation_status: conditional
  - id: TI-WEB-012
    title: 종목 상세 시세 영역 노출
    precondition: 종목 상세 화면에 진입해 있다.
    steps:
      - 상세 화면 상단을 확인한다.
      - 시세, 거래량, 차트 관련 영역을 확인한다.
    expected_result: 시세 또는 차트 영역이 표시된다.
    priority: P0
    tags: [stock-detail, quote]
    data: { query: "삼성전자" }
    smoke: true
    regression: true
    automation_status: conditional
  - id: TI-WEB-013
    title: 종목 상세 차트 기간 선택
    precondition: 종목 상세 차트가 표시되어 있다.
    steps:
      - 1일, 1개월, 1년 같은 기간 옵션을 선택한다.
      - 차트 영역이 유지되는지 확인한다.
    expected_result: 기간 전환 후 차트 오류가 발생하지 않는다.
