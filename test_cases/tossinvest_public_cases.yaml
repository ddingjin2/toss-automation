    title: 네트워크 지연 중 로딩 처리
    precondition: 시장 데이터 API 응답이 지연되는 네트워크 조건이다.
    steps:
      - 홈에 접속한다.
      - 데이터 로딩 중 UI를 확인한다.
      - 응답 후 콘텐츠 전환을 확인한다.
    expected_result: 로딩 중 오류 페이지가 노출되지 않고 최종 콘텐츠가 표시된다.
    priority: P1
    tags: [loading, network]
    data: { network: "slow-3g-or-api-delay" }
    smoke: false
    regression: true
    automation_status: needs_mock_or_staging
  - id: TI-WEB-020
    title: 시장 데이터 API 오류 메시지
    precondition: 시장 데이터 API가 5xx 또는 오류 응답을 반환한다.
    steps:
      - API 오류를 모킹한다.
      - 홈 또는 종목 상세에 접속한다.
      - 오류/재시도 UX를 확인한다.
    expected_result: 사용자가 이해 가능한 오류 안내 또는 재시도 UI가 표시된다.
    priority: P1
    tags: [error, network, negative]
    data: { mocked_status: 500 }
    smoke: false
    regression: true
    automation_status: needs_mock_or_staging
  - id: TI-WEB-021
    title: 주요 링크 키보드 접근
    precondition: 홈에 접속해 있다.
    steps:
      - Tab 키로 주요 네비게이션을 이동한다.
      - Enter로 검색 또는 메뉴를 실행한다.
    expected_result: 포커스 이동과 키보드 실행이 가능하다.
    priority: P1
    tags: [accessibility, keyboard]
    data: {}
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-022
    title: 이미지 대체 텍스트 기본 접근성
    precondition: 홈에 접속해 있다.
    steps:
      - 주요 로고/이미지의 접근 가능한 이름을 확인한다.
    expected_result: 로고 등 핵심 이미지에 접근 가능한 이름이 있다.
    priority: P2
    tags: [accessibility]
    data: {}
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-023
    title: 새로고침 후 홈 상태 복원
    precondition: 홈 콘텐츠가 표시되어 있다.
    steps:
      - 홈을 새로고침한다.
      - 주요 시장 영역을 다시 확인한다.
    expected_result: 새로고침 후에도 검색과 실시간 차트가 표시된다.
    priority: P1
    tags: [home, reliability]
    data: {}
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-024
    title: 공개 정책 링크 이동
    precondition: 홈 푸터가 표시되어 있다.
    steps:
      - 개인정보 처리방침 또는 투자 유의사항 링크를 선택한다.
      - 새 페이지 또는 현재 페이지 이동을 확인한다.
    expected_result: 정책 문서가 접근 가능하고 404가 아니다.
    priority: P2
    tags: [footer, compliance, navigation]
    data: { link_text: "개인정보 처리방침" }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-025
    title: 검색 입력값 초기화
    precondition: 검색 입력창이 열려 있고 검색어가 입력되어 있다.
    steps:
      - 삼성전자를 입력한다.
      - 검색창의 지우기 버튼 또는 전체 선택 후 삭제를 수행한다.
      - 입력값과 결과 영역 상태를 확인한다.
    expected_result: 검색어가 제거되고 검색 전 상태 또는 추천/기본 검색 상태로 돌아간다.
    priority: P1
    tags: [search, usability]
    data: { query: "삼성전자" }
    smoke: false
    regression: true
    automation_status: ready
  - id: TI-WEB-026
    title: 슬래시 키 검색 단축키
    precondition: 사용자는 홈에 접속해 있고 검색 입력창은 닫혀 있다.
    steps:
      - 키보드에서 / 키를 입력한다.
